<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CF Car Race</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #hud-top-left {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 14px;
      line-height: 1.6;
      background: rgba(0,0,0,0.35);
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 160px;
    }
    #hud-top-left .row { display: flex; justify-content: space-between; gap: 16px; }
    #hud-top-left .label { opacity: 0.7; }
    #speed {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 42px;
      font-weight: 700;
      background: rgba(0,0,0,0.35);
      padding: 8px 18px;
      border-radius: 10px;
    }
    #speed span { font-size: 16px; font-weight: 400; opacity: 0.7; margin-left: 6px; }
    #msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      background: #0a0a0f;
      z-index: 10;
    }
    #controls-hint {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 12px;
      opacity: 0.6;
      background: rgba(0,0,0,0.35);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">Loading track…</div>
    <div id="hud">
      <div id="hud-top-left">
        <div class="row"><span class="label">Lap</span><span id="lap">0 / 3</span></div>
        <div class="row"><span class="label">Time</span><span id="time">0:00.000</span></div>
        <div class="row"><span class="label">Best</span><span id="best">--:--.---</span></div>
      </div>
      <div id="speed">0<span>km/h</span></div>
      <div id="msg"></div>
      <div id="controls-hint">WASD / Arrows to drive · Space to handbrake · R to reset</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
