<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CF Car Race</title>
  <style>
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #hud-top-left {
      position: absolute;
      top: calc(10px + var(--safe-t));
      left: calc(10px + var(--safe-l));
      font-size: clamp(11px, 2.6vw, 14px);
      line-height: 1.5;
      background: rgba(0,0,0,0.4);
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 130px;
      backdrop-filter: blur(2px);
    }
    #hud-top-left .row { display: flex; justify-content: space-between; gap: 14px; }
    #hud-top-left .label { opacity: 0.7; }
    #speed {
      position: absolute;
      bottom: calc(14px + var(--safe-b));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;
      background: rgba(0,0,0,0.35);
      padding: 4px 14px;
      border-radius: 10px;
      line-height: 1.1;
    }
    #speed span { font-size: 0.4em; font-weight: 400; opacity: 0.7; margin-left: 4px; }
    #msg {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      text-align: center;
      display: none;
    }
    #countdown {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(48px, 14vw, 96px);
      font-weight: 800;
      color: #fff;
      display: none;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }
    #offtrack {
      position: absolute;
      top: calc(10px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffd23f;
      background: rgba(0,0,0,0.4);
      padding: 5px 12px;
      border-radius: 6px;
      display: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      background: #0a0a0f;
      z-index: 10;
    }
    #controls-hint {
      position: absolute;
      bottom: calc(14px + var(--safe-b));
      left: calc(14px + var(--safe-l));
      font-size: 12px;
      opacity: 0.6;
      background: rgba(0,0,0,0.35);
      padding: 8px 12px;
      border-radius: 8px;
    }
    #reset-btn {
      position: absolute;
      top: calc(10px + var(--safe-t));
      right: calc(10px + var(--safe-r));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      pointer-events: auto;
      cursor: pointer;
    }
    #reset-btn.active { background: rgba(255,255,255,0.35); }
    #btn-fullscreen {
      position: absolute;
      top: calc(58px + var(--safe-t));
      right: calc(10px + var(--safe-r));
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      pointer-events: auto;
      cursor: pointer;
    }
    #btn-fullscreen.active { background: rgba(255,255,255,0.35); }
    #debug-panel {
      position: absolute;
      top: calc(10px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 5;
      min-width: 250px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      background: rgba(5, 10, 16, 0.86);
      color: #9fffb2;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre;
      pointer-events: none;
    }

    /* --- Touch controls --- */
    #touch-controls {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }
    body.touch #touch-controls { display: block; }
    body.touch #controls-hint { display: none; }

    .tbtn {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.28);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s, transform 0.08s;
    }
    .tbtn.active {
      background: rgba(255,255,255,0.32);
      transform: scale(0.94);
    }
    #steer-left {
      left: calc(18px + var(--safe-l));
      bottom: calc(22px + var(--safe-b));
      width: 78px; height: 78px;
    }
    #steer-right {
      left: calc(104px + var(--safe-l));
      bottom: calc(22px + var(--safe-b));
      width: 78px; height: 78px;
    }
    #btn-gas {
      right: calc(18px + var(--safe-r));
      bottom: calc(22px + var(--safe-b));
      width: 92px; height: 92px;
      background: rgba(70, 200, 110, 0.18);
      border-color: rgba(120, 255, 160, 0.4);
      font-size: 15px;
    }
    #btn-brake {
      right: calc(120px + var(--safe-r));
      bottom: calc(34px + var(--safe-b));
      width: 66px; height: 66px;
      background: rgba(220, 70, 70, 0.18);
      border-color: rgba(255, 120, 120, 0.4);
      font-size: 12px;
    }
    #btn-handbrake {
      right: calc(24px + var(--safe-r));
      bottom: calc(128px + var(--safe-b));
      width: 56px; height: 56px;
      background: rgba(255, 200, 60, 0.16);
      border-color: rgba(255, 210, 80, 0.4);
      font-size: 10px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">Loading track…</div>
    <div id="hud">
      <div id="hud-top-left">
        <div class="row"><span class="label">Lap</span><span id="lap">0 / 3</span></div>
        <div class="row"><span class="label">Time</span><span id="time">0:00.000</span></div>
        <div class="row"><span class="label">Best</span><span id="best">--:--.---</span></div>
      </div>
      <div id="offtrack">OFF TRACK</div>
      <div id="debug-panel" aria-live="polite"></div>
      <div id="reset-btn" title="Reset">⟲</div>
      <button id="btn-fullscreen" type="button" title="Enter fullscreen" aria-label="Enter fullscreen"></button>
      <div id="speed">0<span>km/h</span></div>
      <div id="msg"></div>
      <div id="countdown"></div>
      <div id="controls-hint">WASD / Arrows to drive · Space to handbrake · R reset · T/D debug</div>

      <div id="touch-controls">
        <div class="tbtn" id="steer-left">◀</div>
        <div class="tbtn" id="steer-right">▶</div>
        <div class="tbtn" id="btn-brake">BRAKE</div>
        <div class="tbtn" id="btn-gas">GAS</div>
        <div class="tbtn" id="btn-handbrake">⛔</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
